<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schengen Randevu Linkleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: 1. sayfa = arama + bayraklı ülke listesi; 2. sayfa (#ulke) = ülke ayrıntısı */
  --bg: #F4F2F1;
  --surface: #FFFFFF;
  --ink: #1D1B22;
  --muted: #6B6570;
  --line: #E2DDDC;
  --accent: #7A1F2B;      /* bordo pasaport */
  --accent-ink: #FFFFFF;
  --accent-soft: #F3E4E6;
  --warn-bg: #FFF1D6; --warn-ink: #7A4B00;
  --crit-bg: #FCE0DC; --crit-ink: #8E1B10;
  --chip-bg: #ECE8E7;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141216; --surface: #1E1B21; --ink: #F1EDEF; --muted: #A59DA6; --line: #322D35;
    --accent: #C2485A; --accent-ink: #FFFFFF; --accent-soft: #3A1E24;
    --warn-bg: #3B2C10; --warn-ink: #F5C76B; --crit-bg: #3E1A16; --crit-ink: #FF9C8F; --chip-bg: #2A262D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141216; --surface: #1E1B21; --ink: #F1EDEF; --muted: #A59DA6; --line: #322D35;
  --accent: #C2485A; --accent-ink: #FFFFFF; --accent-soft: #3A1E24;
  --warn-bg: #3B2C10; --warn-ink: #F5C76B; --crit-bg: #3E1A16; --crit-ink: #FF9C8F; --chip-bg: #2A262D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 600px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
.search {
  width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.search:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 1. sayfa: liste */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; min-height: 58px;
  text-decoration: none; color: var(--ink); border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row:active { background: var(--accent-soft); }
.flag { font-size: 30px; line-height: 1; width: 36px; text-align: center; flex: none; }
.row .nm { flex: 1; font-weight: 700; font-size: 18px; }
.chev { color: var(--muted); font-size: 22px; flex: none; }
.empty { color: var(--muted); font-size: 15px; padding: 16px; }

/* 2. sayfa: ayrıntı */
.back {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  color: var(--accent); font-weight: 700; font-size: 16px; padding: 8px 0; min-height: 44px;
}
.hero { display: flex; align-items: center; gap: 14px; }
.hero .flag { font-size: 48px; width: auto; }
.hero h1 { font-size: 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 6px; background: var(--chip-bg); color: var(--ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.crit { background: var(--crit-bg); color: var(--crit-ink); }
.go {
  display: flex; flex-direction: column; gap: 2px; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 16px 18px; min-height: 64px;
}
.go strong { font-size: 19px; }
.go small { font-size: 13px; opacity: 0.85; overflow-wrap: anywhere; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; text-decoration: none;
  color: var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 16px;
}
.sec a small { font-weight: 400; font-size: 12px; opacity: 0.9; }
.facts { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; margin: 0; }
.facts div { padding: 10px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 2px; }
.facts dd { margin: 0; font-size: 15px; }
footer { color: var(--muted); font-size: 12px; }
[hidden] { display: none !important; }
</style>
</head>

const flag = cc => String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
const norm = s => s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const host = u => { try { const x = new URL(u); if (x.host.includes("vfsglobal")) return "visa.vfsglobal.com · " + x.pathname.split("/").filter(Boolean).pop(); return x.host.replace(/^www\./, ""); } catch (e) { return u; } };

const home = document.getElementById("home");
const detail = document.getElementById("detail");
const list = document.getElementById("list");
const q = document.getElementById("q");

function renderList() {
  const s = norm(q.value.trim());
  const shown = DATA.filter(d => !s || norm(d.n).includes(s));
  list.innerHTML = shown.length
    ? shown.map(d => `<a class="row" href="#${d.id}"><span class="flag" aria-hidden="true">${flag(d.cc)}</span><span class="nm">${esc(d.n)}</span><span class="chev" aria-hidden="true">›</span></a>`).join("")
    : `<div class="empty">Eşleşen ülke yok.</div>`;
}

function renderDetail(d) {
  const chips = d.k.map(k => `<span class="chip">${esc(k)}</span>`).join("") + d.t.map(([l, c]) => `<span class="chip ${c}">${esc(l)}</span>`).join("");
  const sec = d.s.length ? `<div class="sec">${d.s.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener"><span>${esc(l)}</span><small>${esc(host(u))}</small></a>`).join("")}</div>` : "";
  const facts = [["Başvuru şehirleri", d.city], ["Bölge kuralı", d.reg], ["Bilmeniz gereken", d.note]].filter(([, v]) => v && v !== "—");
  detail.innerHTML = `
    <a class="back" href="#">‹ Tüm ülkeler</a>
    <div class="hero"><span class="flag" aria-hidden="true">${flag(d.cc)}</span><h1>${esc(d.n)}</h1></div>
    <div class="chips">${chips}</div>
    <a class="go" href="${d.p[1]}" target="_blank" rel="noopener"><strong>Randevu al · ${esc(d.p[0])}</strong><small>${esc(host(d.p[1]))}</small></a>
    ${sec}
    <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    <footer>Son kontrol 1 Kasım 2026. Başvurudan önce resmi siteden teyit edin.</footer>`;
}

function route() {
  const id = location.hash.replace(/^#/, "");
  const d = DATA.find(x => x.id === id);
  if (d) {
    renderDetail(d);
    home.hidden = true; detail.hidden = false;
    document.title = d.n + " · Schengen Randevu";
    window.scrollTo(0, 0);
  } else {
    detail.hidden = true; home.hidden = false;
    document.title = "Schengen Randevu Linkleri";
  }
}

q.addEventListener("input", renderList);
window.addEventListener("hashchange", route);
renderList();
route();
</script>
</body>
</html>
